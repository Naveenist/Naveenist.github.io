<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — CodeArrive</title>
<meta name="description" content="That page does not exist. Head back to CodeArrive.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090e">
<meta name="color-scheme" content="dark">

<!--
  GitHub Pages serves this file for ANY unknown URL, at any depth
  (/nope, /a/b/c/nope, ...). Relative asset paths would therefore resolve
  against the wrong directory, and a root-absolute path breaks on project
  sites served from /<repo>/. So this page carries its own styles and has
  no external dependencies at all - it renders correctly wherever it lands.
-->
<style>
  :root {
    --ink: #07090e; --navy: #0e1524; --line: #1d2942; --line-hi: #2a3a5c;
    --royal: #2b5fe3; --royal-hi: #4c7df0;
    --paper: #f3f6fb; --silver: #9aa8be; --steel: #6e7d96;
    --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center;
    padding: 2rem 1.5rem; background: var(--ink); color: var(--paper);
    font-family: var(--sans); line-height: 1.6; text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  /* Same blueprint grid as the rest of the site. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, rgb(255 255 255 / .028) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(255 255 255 / .028) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
  }
  main { position: relative; max-width: 34rem; }
  .mark { width: 44px; height: 40px; margin: 0 auto 2rem; color: var(--royal-hi); display: block; }
  .code {
    font-family: var(--mono); font-size: clamp(4rem, 2rem + 12vw, 9rem);
    font-weight: 700; letter-spacing: -.06em; line-height: 1; color: var(--line-hi);
  }
  h1 {
    margin-top: .5rem; font-size: clamp(1.5rem, 1.1rem + 1.8vw, 2.25rem);
    font-weight: 700; letter-spacing: -.03em; line-height: 1.15;
  }
  p { margin-top: 1rem; color: var(--silver); font-size: clamp(1rem, .95rem + .3vw, 1.125rem); }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 2.25rem; }
  a.btn {
    display: inline-flex; align-items: center; gap: .5rem; min-height: 44px;
    padding: .75rem 1.35rem; border: 1px solid var(--line-hi); border-radius: 10px;
    font-size: .875rem; font-weight: 600; color: var(--paper); text-decoration: none;
    transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
  }
  a.btn:hover { transform: translateY(-1px); background: #1a2540; }
  a.primary { background: var(--royal); border-color: var(--royal); color: #fff; }
  a.primary:hover { background: #3a6cea; border-color: #3a6cea; }
  a.btn:focus-visible { outline: 2px solid var(--royal-hi); outline-offset: 3px; }
  .path { margin-top: 2rem; font-family: var(--mono); font-size: .75rem; color: var(--steel); word-break: break-all; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>
<main>
  <svg class="mark" viewBox="0 0 36 32" fill="none" aria-hidden="true">
    <path d="M17.6 10.6a7.6 7.6 0 1 0 0 10.8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M19.4 25.5 26 6.5l6.6 19" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22.2 19h7.6" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
  </svg>

  <p class="code">404</p>
  <h1>This page took a wrong turn</h1>
  <p>The address you followed does not exist — it may have moved, or the link may have a typo in it.</p>

  <div class="actions">
    <a class="btn primary" id="home" href="/">
      Back to home
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </a>
    <a class="btn" id="market" href="/projects/">Browse the marketplace</a>
    <a class="btn" href="mailto:team@codearrive.com">Email us</a>
  </div>

  <p class="path" id="attempted"></p>
</main>

<script>
(function () {
  // On a GitHub Pages *project* site the whole site is served under /<repo>/,
  // so "/" is not the site root. Derive the prefix from this page's own URL.
  // On a custom domain or a user site (username.github.io) there is no
  // prefix, and this leaves the links untouched.
  var prefix = ''
  if (/\.github\.io$/i.test(location.hostname)) {
    var seg = location.pathname.split('/')[1]
    if (seg) prefix = '/' + seg
  }

  document.getElementById('home').href = prefix + '/'
  document.getElementById('market').href = prefix + '/projects/'
  document.getElementById('attempted').textContent = 'Requested: ' + location.pathname
})()
</script>
</body>
</html>
